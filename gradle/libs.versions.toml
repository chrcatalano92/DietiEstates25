[versions]
agp = "8.13.1"

# AndroidX Core
androidx-appcompat = "1.7.1"
androidx-material = "1.13.0"
androidx-activity = "1.11.0"
androidx-constraintlayout = "2.2.1"
androidx-preference = "1.2.1"
securityCrypto = "1.1.0"
androidx-navigation-fragment = "2.9.6"
androidx-navigation-ui = "2.9.6"

# Testing
androidx-test-ext-junit = "1.3.0"
androidx-test-espresso-core = "3.7.0"
junit = "4.13.2"

# Networking
squareup-retrofit2 = "3.0.0"
squareup-retrofit2-converter-scalars = "3.0.0"
squareup-retrofit2-converter-gson = "3.0.0"
squareup-okhttp3 = "5.3.1"
squareup-okhttp3-logging-interceptor = "5.3.1"

aut0-jwt = "4.5.0"

# Google Play Services
google-play-services-maps = "19.2.0"
google-play-services-location = "21.3.0"

# Image Loading
glide = "5.0.5"

# SonarQube
sonarqube = "7.0.1.6134"

firebaseBom = "34.6.0"
playServicesAuth = "21.4.0"

# Desugaring
desugaring = "2.1.5"

[libraries]
# AndroidX UI
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "androidx-material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
preference = { group = "androidx.preference", name = "preference", version.ref = "androidx-preference" }
activity = { group = "androidx.activity", name = "activity", version.ref = "androidx-activity" }

# GOOGLE
firebase-bom = {group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom"}
firebase-auth = {group = "com.google.firebase", name = "firebase-auth"}
google-playservices-auth = {group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth"}

androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# Navigation
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "androidx-navigation-fragment" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "androidx-navigation-ui" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "squareup-retrofit2" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "squareup-retrofit2-converter-gson" }
converter-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "squareup-retrofit2-converter-scalars" }
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "squareup-okhttp3" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "squareup-okhttp3-logging-interceptor" }

auth0-jwt = {group = "com.auth0", name = "java-jwt", version.ref = "aut0-jwt" }

# Image Loading
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

# Google Play Services
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "google-play-services-maps" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "google-play-services-location" }

desugaring = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugaring" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }